keyNotesList:
  - id: 1
    img: KeynoteImgs/thais.jfif
    nome: Thais Viana
    descricao: "Não dava para fazer o evento no Rio sem ela. A Thais é simplesmente uma das maiores referências da nossa comunidade. São mais de dez anos de dedicação na PyLadies e na PythOnRio, além de ter liderado a Python Brasil 2024 como Big Kahuna.\n\nQuem conhece sabe o quanto ela inspira: uma mulher que concilia o corre dos saberes técnicos, pós-graduação, liderança de comunidade e a maternidade. Não é à toa que recebeu o Prêmio Dorneles Treméa, que só oficializou o valor absurdo que ela entrega pra gente todos os dias.\n\nTer a Thais como keynote em casa vai ser incrível. E óbvio: para que ela e todas as mães e pais aproveitem o evento com tranquilidade, teremos um espaço para acolher os pequenos com todo o carinho."
