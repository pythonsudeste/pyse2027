  - id: 2
    img: KeynoteImgs/nina.jpg
    nome: Nina da Hora
    descricao: "Cientista, pesquisadora e cria da Baixada, a Nina é uma das vozes mais potentes do país quando o assunto é divulgação científica, direitos digitais e a desconstrução da ética dos algoritmos de um jeito que todo mundo consegue entender. À frente do @instituto_dahora, transforma a forma como pensamos o futuro digital.\n\nNina tem a cara da comunidade Python e mostra que falar de tecnologia por aqui vai muito além de linhas de código: envolve responsabilidade social, inclusão e justiça."
