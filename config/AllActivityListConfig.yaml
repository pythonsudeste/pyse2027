        avatar: https://talks.python.org.br/media/avatars/foto-alex_RjmkhIA.jpeg
        biography: >-
          Developer Advocate na Elastic com mais de 25 anos em tecnologia. Ex-Siemens, IBM e Oracle, Doutor em Ciência da Computação tendo trabalhado como professor universitário por 9 anos.
