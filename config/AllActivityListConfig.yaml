  - id: 3
    local: Guido van Rossum
    data: 25 de julho
    hour: 09:35
    type: talk
    title: "Do PDF ao dado estruturado com o Querido Diário"
    description: >-
      O Querido Diário, baseada na stack python, django, scrapy, opensearch e apache tika, vem se consolidando como uma ferramenta de resistência e transparência. Em milhares de cidades brasileiras, atos públicos essenciais como os Diários Oficiais são "escondidos" em PDFs de difícil acesso, impedindo que a sociedade fiscalize como o dinheiro público é investido.
      Nesta palestra, demonstraremos como a comunidade Python brasileira está mudando essa realidade através da união entre tecnologia e cidadania. Nosso foco será mostrar como o Processamento de Linguagem Natural (NLP) e a estruturação de dados permitem que jornalistas, pesquisadores e cidadãos identifiquem monitorem gastos, acompanhem nomeações e atuem sobre os rumos de políticas e debate públicos.
    speaker:
      - name: Haydée Svab
        avatar: https://talks.python.org.br/media/avatars/WFSYCQ_xUTQ6zO.jpeg
        biography: >-
          Haydée Svab lidera a Open Knowledge Brasil e o projeto Querido Diário. Engenheira e mestre (USP), une ciência de dados e cidadania para gerar impacto social e transparência democrática no país.
      - name: Diego Rabatone
        avatar: "https://talks.python.org.br/media/avatars/VUCEMT_IxeWCS7.webp"
        biography: >-
          Pai e Engenheiro, pythonista de longa data, militante de software livre e dados abertos. Trabalha com Dados desde 2009 tendo passado por Estadão, Nubank e Ministério da Justiça.
  - id: 4
    local: Ada Lovelace
    data: 25 de julho
    hour: 09:35
    type: talk
    title: GenAI - A mudança de paradigma no mundo da programação 
    description: >-
      A inteligência artificial generativa deixou de ser promessa para se tornar parte do dia a dia de quem escreve código. Modelos capazes de gerar, revisar e refatorar software estão redesenhando não apenas como programamos, mas quem programa e o que significa ser desenvolvedor.
      Essa transformação se faz sentir primeiro no mercado de trabalho, onde algumas habilidades ganham valor enquanto outras viram commodity. A produtividade individual e a própria estrutura dos times estão sendo reconfiguradas, e isso muda o jogo tanto para quem está começando quanto para quem já chegou à senioridade. A pesquisa também não fica de fora: da revisão de literatura à prototipagem de experimentos, a GenAI acelera os ciclos de investigação ao mesmo tempo em que levanta novas perguntas sobre reprodutibilidade, autoria e o próprio papel do pesquisador no processo de descoberta.
      No centro de tudo isso está uma tensão que vale a pena examinar de perto: a diferença entre vibe-coding e engenharia de software. Programar "no improviso", guiado pela intuição e pelo diálogo com a IA, é poderoso para protótipos e validação rápida, mas esconde armadilhas quando o assunto é escala, manutenção e confiabilidade. Entender onde cada abordagem brilha é essencial para construir sistemas concretos seguindo as boas práticas da programação.
      Mais do que uma exposição de tendências, esta palestra é uma conversa franca sobre oportunidades, riscos e as decisões que vão definir a próxima década do desenvolvimento de software.
    speaker:
      - name: Pedro Cordoeira
        avatar: https://talks.python.org.br/media/avatars/7M9BCK_duLwNjU.webp
        biography: >-
          Sou Pedro Cordoeira, Físico formado pela UFF, mestre e doutorando em Modelagem Computacional pela UERJ e atuando como pesquisador e desenvolvedor de ML no Instituto de Pesquisas Eldorado
  - id: 5
    local: Guido van Rossum
    data: 25 de julho
    hour: 10:25
    type: talk
    title: Como as humanas podem salvar os humanos do impacto da IA
    description: >-
      As incertezas da tecnologia passaram a dominar a ansiedade dos próprios devs. Ferramentas escrevem código, modelos geram respostas, e a promessa de automação parece avançar sobre aquilo que antes era considerado exclusivamente humano. Diante disso, surge uma pergunta inevitável: qual é, afinal, o papel do dev nesse novo cenário?
      Talvez a resposta para esse dilema não esteja na própria tecnologia. Talvez, esteja naquilo que sempre foi humano: entender, questionar e interpretar.
      Se máquinas estão cada vez melhores em produzir respostas, o diferencial humano pode estar justamente na capacidade de fazer as perguntas certas.
      Afinal, se os robôs já estão aqui… como os humanos salvarão os humanos dos robôs?
    speaker:
      - name: Andre Machado
        avatar: https://talks.python.org.br/media/avatars/X3T8HM_YSR6LN8.jpeg
        biography: >-
          Humano babá de IA desde 2021; antes disso, desenvolvedor. Hoje busca fora da tecnologia respostas para se tornar um programador melhor, e encontrou nas humanidades uma fonte inesgotável.
  - id: 6
    local: Ada Lovelace
    data: 25 de julho
    hour: 10:25
    type: talk
    title: "Busca 3.0: Anatomia de um Agente de Busca na era da IA"
    description: >-
      Busca 1.0 foi keywords. Busca 2.0 foi semântica. Busca 3.0 é o agente que raciocina antes de executar.
      Esta palestra disseca a anatomia de um agente de busca moderno: como ele percebe o contexto, decide se uma consulta é necessária, escolha o melhor índice, formula a query certa e sintetiza a resposta — tudo de forma autônoma.
      Com demonstrações práticas em Python e Elasticsearch, veremos os padrões de raciocínio que separam um RAG reativo de um agente verdadeiramente inteligente. MCP, LangChain e outros frameworks aparecem como exemplos de implementação, mas o foco é na arquitetura e nos princípios que funcionam independente de qual ferramenta você usar amanhã.
    speaker:
