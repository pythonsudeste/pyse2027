  - id: 11
    local: Ada Lovelace
    data: 25 de julho
    hour: 14:00
    type: talk
    title: Seu pip install custa caro? O Futuro do PyPI 
    description: >-
      O PyPI é essencial para nós, mas seu crescimento explosivo, impulsionado por milhões de arquivos binários (wheels), gera custos imensos e desafios de sustentabilidade, dependendo fortemente de patrocínios. Esta palestra mergulha nos "custos invisíveis" do pip install, explora os desafios técnicos por trás da hospedagem de pacotes em escala e discute soluções inovadoras – como sistemas de build modernos e caches distribuídos – para garantir um ecossistema Python mais robusto, eficiente e independente para todos nós no Brasil e no mundo.
      O Python Package Index (PyPI) é o coração pulsante do nosso ecossistema, servindo bilhões de downloads diariamente. Usamos pip install sem pensar muito, mas por trás dessa simplicidade existe uma infraestrutura massiva com desafios crescentes. O PyPI hospeda hoje mais de 12 milhões de arquivos, com um crescimento exponencial impulsionado principalmente por wheels (binários pré-compilados).
    speaker:
      - name: Pablo Henrique Aguilar
        avatar: https://talks.python.org.br/media/avatars/8TYELR_AIoC10U.jpeg
        biography: >-
          Pablo Aguilar é um engenheiro de software apaixonado, especializado em desenvolvimento backend. Atualmente, como Engenheiro Sênior de Backend, colaborador de projetos de código aberto e palestrante.
  - id: 12
    local: Guido van Rossum
    data: 25 de julho
    hour: 14:50
    type: talk
    title: Quando assíncrono resolve e quando só complica
    description: >-
      Em aplicações Python, é comum começar com uma API simples em Django, Flask ou FastAPI e, com o tempo, mover tarefas mais pesadas para background usando Celery, Redis, RabbitMQ ou até fluxos com asyncio. No papel, isso parece ótimo: a aplicação responde mais rápido, o processamento fica desacoplado e o sistema ganha mais fôlego para crescer.
      Só que essa mudança também traz um novo tipo de complexidade. Uma task pode rodar duas vezes, uma mensagem pode chegar fora de ordem, um retry pode causar efeito colateral e um erro pode acontecer longe demais da requisição original. O que parecia apenas uma melhoria de performance pode virar um sistema mais difícil de entender, observar e manter.
      Nesta talk, quero discutir esse momento tão comum no ecossistema Python: quando sair do fluxo síncrono realmente ajuda e quando isso só adiciona camadas demais ao sistema. A proposta é mostrar, com foco em aplicações Python, os trade-offs entre request/response tradicional, tarefas em background e comunicação orientada a eventos.
      Também quero explorar práticas que fazem bastante diferença nesse cenário, como idempotência, logs e métricas, DLQ, desenho mais cuidadoso de tasks e eventos, e o uso consciente de ferramentas como Celery e asyncio. No fim, a ideia é simples: ajudar a audiência a tomar decisões mais maduras sobre concorrência e arquitetura assíncrona em Python, entendendo quando essas soluções resolvem um problema real — e quando só complicam.
    speaker:
      - name: Marco Aurelio Soares Abrantes
        avatar: https://talks.python.org.br/media/avatars/QPMT8U_m4mzcpI.png
        biography: >-
          Engenheiro de Software com 6 anos de experiência em Python, backend, cloud, IA e machine learning, com foco em arquitetura, performance, automação e sistemas distribuídos.
  - id: 13
    local: Ada Lovelace
    data: 25 de julho
    hour: 14:50
    type: talk
    title: "Python, Web e IA: A Stack Dev do Futuro (Que Começa Hoje)"
    description: >-
      Ferramentas de IA já estão redesenhando o que significa ser um Dev Python. Nessa palestra, vamos além do hype. Com projeções reais de mercado e aplicações Python concretas, você vai entender para onde a carreira do programador Python está caminhando.
      Apresentarei uma integração real entre projetos de dados (coleta, transformação e carga), integração com LLMs, engenharia de prompt, automação inteligente, backends modernos com FastAPI e visualização prática de dados — um retrato fiel do que o mercado já exige dos programadores Python.
      Por fim, tudo se conecta em uma visão de stack completa: Web + Dados + IA, construída com Python do começo ao fim.
      Você vai sair com:
      * Uma visão clara do mercado e das tendências que moldam a carreira Python
      * Referências de projetos práticos e replicáveis
      * Um mapa mental de como dados, web e IA se integram no dia a dia
      * Motivação real para dar o próximo passo
    speaker:
      - name: Rafael Ferreira
        avatar: https://talks.python.org.br/media/avatars/JBAWQZ_mvy98ZO.jpeg
        biography: >-
          Rafael Ferreira é desenvolvedor Python com experiência em projetos de dados, APIs e aplicações web. Criador do Programador Lhama, compartilha conteúdo prático sobre Python e Desenvolvimento moderno
