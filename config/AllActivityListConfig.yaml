  - id: 16
    local: Guido van Rossum
    data: 26 de julho
    hour: 10:50
    type: talk
    title: Detecção Inteligente de Malware com Python
    description: >-
      Esta apresentação aborda técnicas modernas de segurança da informação utilizando Python como ferramenta central. Inicialmente, são explorados os conceitos de análise estática e dinâmica de malware, com destaque para a extração de características relevantes por meio de ferramentas especializadas. Em seguida, introduz-se o uso de machine learning, especialmente classificadores como SVM, para identificar padrões maliciosos em arquivos e processos.
      A proposta inclui uma abordagem prática, na qual dados extraídos de amostras reais de malware são utilizados para treinar modelos capazes de distinguir comportamentos legítimos de atividades suspeitas. Dessa forma, a apresentação demonstra como integrar análise de malware e inteligência artificial para o desenvolvimento de soluções mais eficazes de detecção e prevenção de ataques cibernéticos.
      Voltada para estudantes e profissionais da área, a apresentação evidencia como técnicas clássicas de segurança podem ser potencializadas com ciência de dados, contribuindo para o desenvolvimento de sistemas de defesa mais inteligentes e proativos.
    speaker:
      - name: Luís Gustavo Martins
        avatar: https://talks.python.org.br/media/avatars/7CSRCM_bgMKn2A.jpeg
        biography: >-
          Natural de Maceió, tenho 23 anos, sou estudante de engenharia eletrônica na UFPE, pesquisador CNPq do grupo Computação Biomédica e programador com experiência em Python, C e C++.
  - id: 17
    local: Ada Lovelace
    data: 26 de julho
