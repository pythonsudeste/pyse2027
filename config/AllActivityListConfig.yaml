  - id: 8
    local: Ada Lovelace
    data: 25 de julho
    hour: 11:15
    type: talk
    title: "Antes do Badge: Uma Jornada Rumo às Certificações de TI"
    description: >-
      O início da nossa jornada pessoal rumo a uma certificação técnica de TI (AWS, Microsoft, Databricks, etc.) costuma ser um terreno bastante arenoso. Vemos as fotos dos badges no LinkedIn, mas raramente nos mostram os bastidores: as madrugadas de estudo, os simulados com notas frustrantes e a velha conhecida síndrome do impostor batendo na porta. Quando a visão fica turva e nebuloso no meio desse processo, é muito fácil desanimarmos, procrastinarmos e eventualmente desistirmos.
      Nesta palestra, vamos deixar as fórmulas mágicas e as idealizações de lado para falar do "mundo real" e mapear o caminho das pedras para a sua próxima aprovação. Utilizando lições práticas extraídas do "campo de batalha" de certificações de Data e Cloud (ex. Datacamp DS Professional, Azure AI-900 e AWS ML Engineer Associate), o conteúdo é focado em entregar estratégias táticas para a sua rotina de estudos respaldadas na materialidade.
      Durante o nosso papo, você vai descobrir: (1)Como avaliar se uma certificação realmente faz sentido para você e o seu momento de carreira; (2) Estratégias táticas de preparação, uso de laboratórios e como desviar das "cascas de banana" das avaliações; (3) Como lidar com a ansiedade, a pressão do tempo e a montanha-russa emocional do processo. O objetivo é criar um espaço seguro para trocar figurinhas, esclarecer dúvidas e te entregar o arsenal necessário para conquistar seus próximos objetivos profissionais, garantindo o seu badge sem perder a sua sanidade e essência no meio do caminho.
    speaker:
      - name: Gustavo Mendonça Ferratti
        avatar: https://talks.python.org.br/media/avatars/VBAPAF_chJQ4xF.png
        biography: >-
