    title: "Side project: um assistente de saúde privacy-first"
    description: >-
      sabe aquele projetinho que surge de um incômodo seu, que vai ganhando forma e você decide levar a sério? o meu é um assistente de anamnese com IA focado em privacidade, que ajuda pacientes a se organizarem antes de uma consulta médica.
      nesta atividade, quero compartilhar a evolução do projeto: como e por que implementei uma arquitetura "zero-persistence" usando FastAPI no backend e Reflex (frontend 100% Python), e até geração dinâmica de PDFs em memória. mas a brincadeira não para no código: vou mostrar como foi tirar da máquina local, fazer o deploy serverless no Cloud Run e tentar melhorar a partir de feedback de usuários.
      se você tem curiosidade sobre saúde, desenvolvimento de produto e privacidade, chegam mais.
