    local: Laboratório para tutoriais
    data: 24 de julho
    hour: 14:30
    type: tutorial
    title: "Django ORM: indo além do objeto-relacional"
    description: >-
      Utilizar recursos como ferramentas Objeto-Relacional permite que desenvolvedores façam consultas complexas e não triviais sem precisar conhecer profundamente a linguagem SQL ou o dialeto de um banco de dados relacional. Porém, quando não damos a atenção devida às relações e consultas que estamos gerando, podemos gerar sobrecarga no banco ou trafegar/utilizar informações desnecessárias.
      Entendendo o que queremos fazer e como faríamos isso com a linguagem SQL nos permite gerar melhores consultas através do Django ORM. Isso nos permite não só melhorar nosso programa, como nos dá a possibilidade de enriquecer o conhecimento em bancos relacionais e SQL.
