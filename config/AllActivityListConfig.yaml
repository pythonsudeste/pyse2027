  - id: 18
    local: Guido van Rossum
    data: 26 de julho
    hour: 14:00
    type: talk
    title: "Se a cabeça não usa, atrofia: LLMs e a ilusão do saber"
    description: >-
      Modelos de linguagem passaram rapidamente a fazer parte do cotidiano de quem programa. Eles ajudam a gerar código, explicar conceitos e explorar ideias. No entanto, junto com essa facilidade surgiu um risco sutil: a sensação de que estamos entendendo mais do que realmente entendemos.
      Quando uma LLM produz uma resposta convincente ou um trecho de código aparentemente correto, é fácil assumir que o problema foi compreendido. Mas muitas vezes o entendimento permanece superficial. Surge então uma nova forma de ilusão de produtividade e aprendizado: muito texto, muito código e pouca reflexão real.
      No ensino de programação esse desafio aparece de forma muito concreta. Como incentivar alunos a usar LLMs como ferramenta de apoio sem que elas substituam o processo de raciocínio? Como avaliar aprendizado quando uma resposta pode ser gerada em segundos?
      Nesta palestra compartilho experiências práticas do ensino de Python para iniciantes em um contexto onde LLMs já fazem parte da realidade dos alunos. Entre elas, estratégias para formular prompts que incentivam a exploração do problema sem pedir diretamente a solução, além de formas de avaliação que revelam o que o aluno realmente compreende — por exemplo, atividades que exigem entender, adaptar e modificar código existente.
      A proposta não é rejeitar o uso de LLMs. Pelo contrário: elas podem ser ferramentas extremamente úteis. O desafio é aprender a utilizá-las com clareza, pensamento crítico e os pés no chão.
      Porque, no fim, continua valendo uma regra simples que sempre repito aos alunos: se a cabeça não usa, atrofia.
    speaker:
      - name: Fernando Masanori Ashikaga
        avatar: https://talks.python.org.br/media/avatars/Fernando_Masanori_O_Globo_NYpkEXH.jpg
        biography: >-
          Professor e entusiasta da comunidade Python. Acredita que ensinar transforma vidas — a dos alunos e a dele. Costuma tomar decisões por impulso que dão certo.
  - id: MicroPython_Mega_Possibilidades_Juliana_Karoline
    local: Guido van Rossum
    data: 26 de julho
    hour: 14:00
    type: talk
    title: "MicroPython, Mega Possibilidades"
    description: >-
      Você, programador Python, tem interesse em explorar o mundo do hardware, mas não sabe por onde começar? O MicroPython pode te abrir as portas do desenvolvimento de aplicações embarcadas!
      Além de tornar o desenvolvimento mais rápido e menos complexo, o MicroPython permite que pessoas consigam tirar do papel seus projetos de modo a reaproveitar seus conhecimentos de Python.
      Nessa palestra iremos ver como é o processo de desenvolvimento com MicroPython, as ferramentas disponíveis nesse ecossistema e as diversas possibilidades de projetos que são possíveis de serem feitos.
      Desde aplicações IoT, sistemas de automação residencial ou até mesmo robôs, essa pequena reimplementação do Python é poderosa e pode te surpreender.
