    hour: 10:00
    type: talk
    title: Ansiedade por Insuficiência em profissionais de Tecnologia
    description: >-
      Áreas de tecnologia, principalmente voltada para desenvolvedores, são marcadas pelo sentimento de alta performance, atualização constante, competitividade global e métricas claras de resultado. Nesse cenário, muitos profissionais desenvolvem um padrão silencioso de sofrimento: a ansiedade por insuficiência. Não se trata apenas de síndrome do impostor, é um estado contínuo de autocobrança, medo de obsolescência, comparação constante e sensação de nunca ser tecnicamente bom o suficiente, mesmo diante de resultados objetivos.
